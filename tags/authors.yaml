# Author whitelist for arxiv-radar-physics.
#
# After the regex relevance_filter rejects a paper, daily_arxiv does a
# second-chance check against this whitelist. Matched papers enter with
# topic `via:author-whitelist:<note>`.
#
# Scope: scientific machine learning (SciML), PINNs, neural operators,
# operator learning, dynamical systems, equivariant ML for physics.

authors:

  # --- PINNs / neural operators / scientific ML ---

  - name_match: ["Karniadakis", "George Karniadakis", "George Em Karniadakis"]
    note: "PINNs, DeepONet"

  - name_match: ["Brunton", "Steven Brunton", "Steve Brunton"]
    note: "SINDy, data-driven dynamics"

  - name_match: ["Kutz, J", "J. Nathan Kutz"]
    note: "data-driven dynamical systems"

  - name_match: ["Mishra, S", "Siddhartha Mishra"]
    note: "neural operators, PDE learning"

  - name_match: ["Anandkumar", "Anima Anandkumar"]
    note: "Fourier neural operators"

  - name_match: ["Kovachki", "Nikola Kovachki"]
    note: "neural operators"

  - name_match: ["Bhattacharya, K", "Kaushik Bhattacharya"]
    note: "neural operators, multi-scale"

  - name_match: ["Battaglia, P", "Peter Battaglia"]
    note: "graph networks for physics simulation"

  # --- Equivariant ML / inductive bias ---

  - name_match: ["Cohen, T", "Taco Cohen"]
    note: "equivariant neural networks"

  - name_match: ["Welling", "Max Welling"]
    note: "equivariant ML, generative models"

  - name_match: ["Smidt, T", "Tess Smidt"]
    note: "e3nn, equivariant tensor networks"

  - name_match: ["Bronstein, M", "Michael Bronstein"]
    note: "geometric deep learning"

  # --- Dynamical systems / chaos / Koopman ---

  - name_match: ["Mezić", "Mezic", "Igor Mezić"]
    note: "Koopman operator theory"

  - name_match: ["Sapsis", "Themistoklis Sapsis"]
    note: "extreme events, dynamical systems"

  # --- Physics-informed / Hamiltonian ML ---

  - name_match: ["Zanna, L", "Laure Zanna"]
    note: "ML for climate, dynamical systems"

  - name_match: ["Raissi", "Maziar Raissi"]
    note: "PINNs co-author"

  - name_match: ["Perdikaris", "Paris Perdikaris"]
    note: "PINNs, Bayesian SciML"
